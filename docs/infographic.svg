<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1d2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d2137;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d3b2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#071f18;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b4e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#180d2e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b2200;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1f1200;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a9eff" opacity="0.8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#34d399" opacity="0.8"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b" opacity="0.8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="180" x2="900" y2="180"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="360" x2="900" y2="360"/>
    <line x1="0" y1="420" x2="900" y2="420"/>
    <line x1="0" y1="480" x2="900" y2="480"/>
    <line x1="0" y1="540" x2="900" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="620"/>
    <line x1="300" y1="0" x2="300" y2="620"/>
    <line x1="450" y1="0" x2="450" y2="620"/>
    <line x1="600" y1="0" x2="600" y2="620"/>
    <line x1="750" y1="0" x2="750" y2="620"/>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" filter="url(#glow)" letter-spacing="1">MailFlow Engine</text>
  <text x="450" y="58" text-anchor="middle" fill="#4a9eff" font-size="11" letter-spacing="3">AI-POWERED EMAIL AUTOMATION · ON-PREMISE</text>
  <line x1="60" y1="68" x2="840" y2="68" stroke="#4a9eff" stroke-width="0.5" opacity="0.4"/>

  <!-- ── ROW 1: Sources ── -->
  <!-- IMAP Box -->
  <rect x="40" y="88" width="160" height="80" rx="8" fill="url(#blueGrad)" stroke="#4a9eff" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="112" text-anchor="middle" fill="#4a9eff" font-size="18">📧</text>
  <text x="120" y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">IMAP</text>
  <text x="120" y="148" text-anchor="middle" fill="#8892a4" font-size="10">Gmail · Outlook · Any</text>
  <text x="120" y="162" text-anchor="middle" fill="#8892a4" font-size="10">IMAP server</text>

  <!-- Outlook Box -->
  <rect x="220" y="88" width="160" height="80" rx="8" fill="url(#blueGrad)" stroke="#4a9eff" stroke-width="1" filter="url(#shadow)"/>
  <text x="300" y="112" text-anchor="middle" fill="#4a9eff" font-size="18">☁️</text>
  <text x="300" y="132" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Microsoft 365</text>
  <text x="300" y="148" text-anchor="middle" fill="#8892a4" font-size="10">Graph API · OAuth2</text>
  <text x="300" y="162" text-anchor="middle" fill="#8892a4" font-size="10">Multi-tenant</text>

  <!-- Sources label -->
  <text x="210" y="82" text-anchor="middle" fill="#4a9eff" font-size="9" letter-spacing="2" opacity="0.7">EMAIL SOURCES</text>

  <!-- ── ROW 1: Arrows sources → ingestion ── -->
  <line x1="200" y1="128" x2="235" y2="128" stroke="#4a9eff" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)" stroke-dasharray="4,2"/>
  <line x1="380" y1="128" x2="415" y2="128" stroke="#4a9eff" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)" stroke-dasharray="4,2"/>

  <!-- ── Ingestion Workers ── -->
  <rect x="415" y="88" width="170" height="80" rx="8" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="1" filter="url(#shadow)"/>
  <text x="500" y="112" text-anchor="middle" fill="#60a5fa" font-size="16">⚙️</text>
  <text x="500" y="130" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">Ingestion Workers</text>
  <text x="500" y="146" text-anchor="middle" fill="#8892a4" font-size="10">Fetch · Parse RFC822</text>
  <text x="500" y="160" text-anchor="middle" fill="#8892a4" font-size="10">Store · Deduplicate</text>
  <text x="415" y="82" text-anchor="start" fill="#60a5fa" font-size="9" letter-spacing="2" opacity="0.7">INGESTION</text>

  <!-- Ingestion → Redis -->
  <line x1="585" y1="128" x2="635" y2="128" stroke="#4a9eff" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- ── Redis Queue ── -->
  <rect x="635" y="100" width="120" height="56" rx="8" fill="#1a0a00" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="122" text-anchor="middle" fill="#f59e0b" font-size="16">⚡</text>
  <text x="695" y="140" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Redis Queue</text>
  <text x="695" y="153" text-anchor="middle" fill="#8892a4" font-size="9">AOF Persistent</text>
  <text x="635" y="82" text-anchor="start" fill="#f59e0b" font-size="9" letter-spacing="2" opacity="0.7">QUEUE</text>

  <!-- Redis → AI Worker (down arrow) -->
  <line x1="695" y1="156" x2="695" y2="208" stroke="#f59e0b" stroke-width="1.5" opacity="0.6" marker-end="url(#arrowOrange)"/>

  <!-- ── AI Worker ── -->
  <rect x="590" y="208" width="210" height="110" rx="8" fill="url(#purpleGrad)" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="695" y="230" text-anchor="middle" fill="#a78bfa" font-size="9" letter-spacing="2">AI PROCESSING</text>
  <text x="695" y="248" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">🧠 Hybrid Classifier</text>

  <!-- Rule box inside -->
  <rect x="602" y="256" width="88" height="48" rx="5" fill="#1a0d2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="646" y="274" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Rule Engine</text>
  <text x="646" y="288" text-anchor="middle" fill="#8892a4" font-size="9">Fast · Deterministic</text>
  <text x="646" y="300" text-anchor="middle" fill="#8892a4" font-size="9">Confidence: 1.0</text>

  <!-- LLM box inside -->
  <rect x="698" y="256" width="88" height="48" rx="5" fill="#1a0d2e" stroke="#7c3aed" stroke-width="1"/>
  <text x="742" y="274" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">LLM (Qwen 2.5)</text>
  <text x="742" y="288" text-anchor="middle" fill="#8892a4" font-size="9">Local · Private</text>
  <text x="742" y="300" text-anchor="middle" fill="#8892a4" font-size="9">Fallback ≥0.75</text>

  <!-- ── Outputs from AI Worker ── -->

  <!-- AI → IMAP Move (left-down) -->
  <line x1="620" y1="318" x2="490" y2="370" stroke="#34d399" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowGreen)"/>

  <!-- AI → PostgreSQL (down) -->
  <line x1="695" y1="318" x2="695" y2="370" stroke="#34d399" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowGreen)"/>

  <!-- AI → Telegram (right) -->
  <line x1="800" y1="263" x2="840" y2="263" stroke="#f59e0b" stroke-width="1.5" opacity="0.7" marker-end="url(#arrowOrange)" stroke-dasharray="4,2"/>

  <!-- ── NeedsReview → Telegram ── -->
  <rect x="840" y="220" width="18" height="86" rx="3" fill="#f59e0b" opacity="0.15"/>
  <text x="849" y="272" text-anchor="middle" fill="#f59e0b" font-size="9" transform="rotate(-90,849,272)" letter-spacing="1">NEEDS REVIEW</text>

  <!-- Telegram box -->
  <rect x="820" y="88" width="64" height="116" rx="8" fill="#0d1f3b" stroke="#4a9eff" stroke-width="1" filter="url(#shadow)"/>
  <text x="852" y="115" text-anchor="middle" fill="#4a9eff" font-size="22">✈️</text>
  <text x="852" y="135" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">Telegram</text>
  <text x="852" y="150" text-anchor="middle" fill="#8892a4" font-size="9">Review</text>
  <text x="852" y="163" text-anchor="middle" fill="#8892a4" font-size="9">request</text>
  <text x="852" y="178" text-anchor="middle" fill="#34d399" font-size="9">↩ You reply</text>
  <text x="852" y="191" text-anchor="middle" fill="#8892a4" font-size="9">→ moved</text>

  <!-- Telegram reply arrow back -->
  <path d="M820,220 Q780,240 770,318" stroke="#f59e0b" stroke-width="1" fill="none" opacity="0.4" stroke-dasharray="3,3" marker-end="url(#arrowOrange)"/>

  <!-- ── IMAP Folders ── -->
  <rect x="350" y="370" width="150" height="130" rx="8" fill="url(#greenGrad)" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
  <text x="425" y="393" text-anchor="middle" fill="#34d399" font-size="9" letter-spacing="2">IMAP FOLDERS</text>
  <text x="425" y="410" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Auto-Moved 📁</text>
  <text x="425" y="428" text-anchor="middle" fill="#6ee7b7" font-size="10">📂 Invoices</text>
  <text x="425" y="444" text-anchor="middle" fill="#6ee7b7" font-size="10">📂 Work</text>
  <text x="425" y="460" text-anchor="middle" fill="#6ee7b7" font-size="10">📂 Marketing</text>
  <text x="425" y="476" text-anchor="middle" fill="#6ee7b7" font-size="10">📂 Spam</text>
  <text x="425" y="492" text-anchor="middle" fill="#f59e0b" font-size="10">📂 NeedsReview</text>

  <!-- ── PostgreSQL ── -->
  <rect x="590" y="370" width="210" height="100" rx="8" fill="url(#blueGrad)" stroke="#4a9eff" stroke-width="1" filter="url(#shadow)"/>
  <text x="695" y="392" text-anchor="middle" fill="#4a9eff" font-size="9" letter-spacing="2">PERSISTENCE</text>
  <text x="695" y="410" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">🗄 PostgreSQL</text>
  <text x="695" y="428" text-anchor="middle" fill="#8892a4" font-size="10">Emails · Accounts · Attachments</text>
  <text x="695" y="444" text-anchor="middle" fill="#8892a4" font-size="10">AI Confidence · Token ROI</text>
  <text x="695" y="460" text-anchor="middle" fill="#8892a4" font-size="10">Telemetry · Audit Log</text>

  <!-- PostgreSQL → Dashboard -->
  <line x1="695" y1="470" x2="695" y2="510" stroke="#4a9eff" stroke-width="1.5" opacity="0.6" marker-end="url(#arrow)"/>

  <!-- ── Dashboard ── -->
  <rect x="490" y="510" width="410" height="85" rx="8" fill="url(#blueGrad)" stroke="#60a5fa" stroke-width="1" filter="url(#shadow)"/>
  <text x="695" y="530" text-anchor="middle" fill="#60a5fa" font-size="9" letter-spacing="2">SUPERVISION</text>
  <text x="695" y="548" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">📊 Streamlit Dashboard</text>

  <!-- Dashboard items -->
  <rect x="502" y="556" width="86" height="30" rx="4" fill="#0d2137" stroke="#4a9eff" stroke-width="0.5"/>
  <text x="545" y="567" text-anchor="middle" fill="#93c5fd" font-size="9">KPI Metrics</text>
  <text x="545" y="579" text-anchor="middle" fill="#8892a4" font-size="8">Confidence · Speed</text>

  <rect x="596" y="556" width="86" height="30" rx="4" fill="#0d2137" stroke="#4a9eff" stroke-width="0.5"/>
  <text x="639" y="567" text-anchor="middle" fill="#93c5fd" font-size="9">Classification</text>
  <text x="639" y="579" text-anchor="middle" fill="#8892a4" font-size="8">Charts · Breakdown</text>

  <rect x="690" y="556" width="86" height="30" rx="4" fill="#0d2137" stroke="#4a9eff" stroke-width="0.5"/>
  <text x="733" y="567" text-anchor="middle" fill="#93c5fd" font-size="9">Audit Log</text>
  <text x="733" y="579" text-anchor="middle" fill="#8892a4" font-size="8">Last 200 emails</text>

  <rect x="784" y="556" width="104" height="30" rx="4" fill="#0d2137" stroke="#4a9eff" stroke-width="0.5"/>
  <text x="836" y="567" text-anchor="middle" fill="#93c5fd" font-size="9">Account Mgmt</text>
  <text x="836" y="579" text-anchor="middle" fill="#8892a4" font-size="8">IMAP · Outlook · Creds</text>

  <!-- ── Security Badge ── -->
  <rect x="40" y="208" width="160" height="96" rx="8" fill="#0d1a0d" stroke="#34d399" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="228" text-anchor="middle" fill="#34d399" font-size="9" letter-spacing="2">SECURITY</text>
  <text x="120" y="246" text-anchor="middle" fill="#6ee7b7" font-size="11">🔐 Fernet Encryption</text>
  <text x="120" y="262" text-anchor="middle" fill="#8892a4" font-size="10">Credentials at rest</text>
  <text x="120" y="278" text-anchor="middle" fill="#6ee7b7" font-size="11">🏠 100% On-Premise</text>
  <text x="120" y="294" text-anchor="middle" fill="#8892a4" font-size="10">No data leaves server</text>

  <!-- ── Deployment Badge ── -->
  <rect x="40" y="320" width="160" height="80" rx="8" fill="#0d1117" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="120" y="340" text-anchor="middle" fill="#f59e0b" font-size="9" letter-spacing="2">DEPLOYMENT</text>
  <text x="120" y="358" text-anchor="middle" fill="#fcd34d" font-size="11">🐳 Docker Compose</text>
  <text x="120" y="374" text-anchor="middle" fill="#8892a4" font-size="10">Traefik · HTTPS · TLS</text>
  <text x="120" y="390" text-anchor="middle" fill="#8892a4" font-size="10">GitHub Actions · Portainer</text>

  <!-- ── Footer ── -->
  <line x1="60" y1="606" x2="840" y2="606" stroke="#4a9eff" stroke-width="0.5" opacity="0.3"/>
  <text x="450" y="617" text-anchor="middle" fill="#4a6080" font-size="9">Appa8 AI Process Automation Hub · MailFlow Engine v1.1.1 · on-premise · GDPR-friendly</text>

</svg>
