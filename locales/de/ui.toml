rules_only = "Nur gelernte Regeln werden ausgeführt. Nicht zugeordnete E-Mails gehen zur manuellen Überprüfung an Telegram. Keine LLM-Kosten."
llm_only   = "Jede E-Mail geht an das LLM und überspringt Regeln. Nützlich zur Überprüfung der Modellqualität."
