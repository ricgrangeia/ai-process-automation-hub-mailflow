# ── In-App-Hilfetext ──────────────────────────────────────────────────────────

[help]
_label = "So funktioniert es"

dashboard = """
**Was Sie hier sehen**
Die letzten 200 E-Mails, die vom KI-Worker klassifiziert und verschoben wurden.

**Metriken**
- **E-Mails gesamt** — verarbeitete E-Mails seit Systemstart
- **Ø Konfidenz** — wie sicher die KI war (höher = besser)
- **Ø vLLM-Zeit** — durchschnittliche LLM-Antwortzeit in Sekunden

**Diagramme**
- **Ordnerverteilung** — welche Ordner die meisten E-Mails erhalten haben
- **Entscheidungen: Regeln vs. KI** — wie viele Entscheidungen durch gelernte Regeln vs. das KI-Modell getroffen wurden

**Tabelle**
Klicken Sie auf einen Spaltenheader zum Sortieren. Konfidenz wird als Prozentsatz angezeigt.
"""

accounts = """
**Was Sie hier tun können**
- **Aktivieren / Deaktivieren** — Worker starten oder stoppen, der ein Postfach abruft
- **Worker-Modus** — legt fest, welcher Worker dieses Konto verwaltet:
  - 🤖 *KI-Worker* — vollständige Pipeline: klassifizieren, Regeln prüfen, verschieben, Telegram-Überprüfung
  - 🧾 *Rechnungs-Worker* — verarbeitet nur Finanz-E-Mails (Rechnungen, Quittungen); ignoriert alles andere (bleibt ungelesen, wird nicht verschoben)
- **Passwort zurücksetzen** — das verschlüsselte IMAP/Outlook-Passwort aktualisieren

**Konto hinzufügen**
Verwenden Sie die Tabs IMAP oder Outlook unten, um ein neues Postfach zu konfigurieren.
"""

rules = """
**Was sind gelernte Regeln?**
Regeln sind Muster, die gespeichert werden, wenn Sie eine E-Mail über Telegram korrigieren. Sie werden **vor** der KI ausgelöst — keine LLM-Kosten, sofortige Entscheidungen.

**Bedingungstypen**
- `sender_email` — genaue E-Mail-Adresse
- `sender_domain` — Domain-Übereinstimmung (z.B. `firma.de`)
- `keyword` — Wort in Betreff oder Text gefunden

**Was Sie tun können**
- **Filterleiste** — nach Schlüsselwort, Absender, Ordner oder Status suchen
- **Umschalten** — eine Regel ohne Löschen deaktivieren
- **Bearbeiten** — Bedingungen, Min-Match-Anzahl oder Zielordner ändern
- **Löschen** — eine Regel dauerhaft entfernen
- **Manuell hinzufügen** — Regeln ohne Telegram erstellen
"""

folders = """
**Wofür Ordner da sind**
Ordner sind die Klassifikationskategorien, die im KI-Prompt, Telegram-Buttons und IMAP-Zielen verwendet werden.

**Was Sie tun können**
- Aktive Ordner erscheinen in den KI-Optionen bei der E-Mail-Klassifikation
- **Deaktivieren** — verbirgt einen Ordner vor der KI ohne den Verlauf zu löschen
- **Umbenennen** — benennt auch den IMAP-Ordner auf **allen aktiven Konten** um
- **Löschen** — funktioniert nur, wenn keine E-Mails den Ordner referenzieren (stattdessen deaktivieren)

**Ordner hinzufügen**
Neue Ordner werden sowohl in der Datenbank als auch als IMAP-Postfächer auf allen aktiven Konten erstellt.
"""

companies = """
**Wofür Unternehmen da sind**
Unternehmen werden über die Steuernummer (NIF) mit Rechnungen abgeglichen. Wenn die Verkäufer- oder Käufer-NIF einer Rechnung mit einem registrierten Unternehmen übereinstimmt, wird das PDF an den Archivordner dieses Unternehmens weitergeleitet.

**Was Sie tun können**
- **Hinzufügen** — ein Unternehmen mit Name + Steuernummer registrieren
- **Bearbeiten** — Name, Steuernummer oder Notizen aktualisieren
- **Inaktiv** — vom Abgleich ausschließen ohne zu löschen
- **Löschen** — dauerhaft entfernen (betrifft keine vorhandenen Rechnungen)
"""

invoices = """
**Was Sie hier sehen**
Rechnungsdaten aus PDF-QR-Codes (Portugiesisches AT/ATCUD-Format) und E-Mail-Texten.

**Tabs**
- 🇵🇹 **AT-Rechnungen** — Portugiesische Rechnungen mit ATCUD, NIF, MB-Zahlungsreferenz
- 🌍 **Ausland** — Internationale Quittungen, SaaS-Abonnements, Überweisungen

**Filter**
- *Letzte N Monate* — Datumsbereich
- *NIF Verkäufer enthält* — nach Verkäufer-Steuernummer filtern
- *Rechnungs-Nr. / ATCUD enthält* — nach Dokumentnummer suchen

**Exportieren**
Verwenden Sie die **⬇️ Export CSV**-Schaltfläche, um alle sichtbaren Zeilen herunterzuladen.
"""

audit = """
**Was das Prüfprotokoll erfasst**
Jede Aktion von Dashboard-Benutzern und Workern wird hier dauerhaft aufgezeichnet.

**Akteur-Typen**
- `dashboard` — Aktionen, die Sie in dieser Benutzeroberfläche durchführen
- `ai-worker` — E-Mail-Klassifikation und -Verschiebung
- `invoice-worker` — Verarbeitung von Finanz-E-Mails
- `telegram` — Genehmigungen und Korrekturen über Telegram

**Filter**
Nach Akteur-Name, Aktionstyp oder Datumsbereich filtern.
Es werden maximal 500 Ereignisse gleichzeitig angezeigt.
"""

settings = """
**Archivordner-Struktur**
Legt den Unterordnerpfad fest, unter dem exportierte Rechnungs-PDFs in `FILES_ROOT` gespeichert werden.

**Verfügbare Token**
Verwenden Sie `{token}`-Platzhalter für dynamische Pfade. Beispiel:
`{company}/{year}/{month}-{month_name}/{category}/{supplier}`
→ `Acme GmbH/2025/04-April/Rechnungen/EDP Comercial/rechnung.pdf`

**Speichern**
Änderungen werden sofort wirksam — kein Neustart erforderlich. Verwenden Sie **↩️ Zurücksetzen** für den Standardwert.
"""

