# ── Hilfetext ─────────────────────────────────────────────────────────────────

[help]
_label = "So funktioniert es"

dashboard = """
**Was Sie hier sehen**
Die letzten 200 vom KI-Worker klassifizierten E-Mails.

**Metriken**
- **E-Mails gesamt** — verarbeitete E-Mails seit Systemstart
- **Ø Konfidenz** — wie sicher die KI war
- **Ø vLLM-Zeit** — durchschnittliche LLM-Antwortzeit

**Diagramme**
- **Ordnerverteilung** — welche Ordner die meisten E-Mails erhielten
- **Entscheidungen** — Regeln vs. KI-Modell
"""

accounts = """
**Was Sie hier tun können**
- **Aktivieren / Deaktivieren** — Worker für ein Postfach starten oder stoppen
- **Worker-Modus** — 🤖 KI-Worker oder 🧾 Rechnungs-Worker
- **Passwort zurücksetzen** — verschlüsseltes Passwort aktualisieren
"""

rules = """
**Was sind gelernte Regeln?**
Muster aus Telegram-Korrekturen. Laufen vor der KI — keine LLM-Kosten.

**Bedingungstypen**
- `sender_email` — genaue E-Mail-Adresse
- `sender_domain` — Domain (z.B. `firma.de`)
- `keyword` — Wort im Betreff oder Text
"""

folders = """
**Was Ordner tun**
Klassifizierungskategorien für KI, Telegram und IMAP.

- **Deaktivieren** — aus KI ausblenden ohne Verlust
- **Umbenennen** — auch IMAP-Ordner auf allen Konten
- **Löschen** — nur wenn keine E-Mails referenziert
"""

companies = """
**Wofür Unternehmen sind**
Über NIF mit Rechnungen abgeglichen für PDF-Archivierung.
"""

invoices = """
**Was Sie hier sehen**
Rechnungsdaten aus PDF-QR-Codes (AT/ATCUD) und E-Mail-Texten.

**Registerkarten**
- 🇵🇹 AT-Rechnungen mit ATCUD und NIF
- 🌍 Ausländische Belege und SaaS-Abonnements
"""

audit = """
**Was das Auditprotokoll verfolgt**
Alle Aktionen von Dashboard, Workern und Telegram.

**Akteurtypen:** `dashboard`, `ai-worker`, `invoice-worker`, `telegram`
"""

settings = """
**Archiv-Ordnerstruktur**
Unterordnerpfad in `FILES_ROOT` für exportierte PDFs.

Beispiel: `{company}/{year}/{month}-{month_name}/{category}/{supplier}`
"""

