
networks:
  proxy:
    name: 'proxy-network'
    external: true
  mail:
    name: mail-network
    external: true
  database:
    name: 'database-network'
    external: true
  ai:
    name: 'ai-network'
    external: true

services:

  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  email-worker:
    build: .
    container_name: mailflow-email-worker
    restart: unless-stopped
    depends_on:
      - redis
    command: ["python", "-m", "app.ingestion.imap.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ROOT: ${STORAGE_ROOT}
      MASTER_KEY: ${MASTER_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LANGUAGE: ${LANGUAGE:-en}
    volumes:
      - mail_storage:/storage
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  api-worker:
    build: .
    container_name: mailflow-api-worker
    restart: unless-stopped
    depends_on:
      - redis
    command: ["python", "-m", "app.ingestion.outlook.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ROOT: ${STORAGE_ROOT}
      MASTER_KEY: ${MASTER_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      LANGUAGE: ${LANGUAGE:-en}
    volumes:
      - mail_storage:/storage
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  ai-worker:
    build: .
    container_name: mailflow-ai-worker
    restart: unless-stopped
    depends_on:
      - redis
    command: ["python", "-m", "app.processing.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ROOT: ${STORAGE_ROOT}
      MASTER_KEY: ${MASTER_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TOOL_SERVER_URL: ${TOOL_SERVER_URL}
      TOOL_SERVER_API_KEY: ${TOOL_SERVER_API_KEY}
      FILES_ROOT: ${FILES_ROOT:-/files}
      COMPANY_NAME: ${COMPANY_NAME:-Company}
      LANGUAGE: ${LANGUAGE:-en}
    volumes:
      - mail_storage:/storage
      - files_storage:/files
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  invoice-worker:
    build: .
    container_name: mailflow-invoice-worker
    restart: unless-stopped
    depends_on:
      - redis
    command: ["python", "-m", "app.invoice_worker.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ROOT: ${STORAGE_ROOT}
      MASTER_KEY: ${MASTER_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TOOL_SERVER_URL: ${TOOL_SERVER_URL}
      TOOL_SERVER_API_KEY: ${TOOL_SERVER_API_KEY}
      FILES_ROOT: ${FILES_ROOT:-/files}
      COMPANY_NAME: ${COMPANY_NAME:-Company}
      LANGUAGE: ${LANGUAGE:-en}
    volumes:
      - mail_storage:/storage
      - files_storage:/files
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  telegram-bot:
    build: .
    container_name: mailflow-telegram-bot
    restart: unless-stopped
    depends_on:
      - redis
    command: ["python", "-m", "app.telegram.bot"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ROOT: ${STORAGE_ROOT}
      MASTER_KEY: ${MASTER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TOOL_SERVER_URL: ${TOOL_SERVER_URL}
      TOOL_SERVER_API_KEY: ${TOOL_SERVER_API_KEY}
      FILES_ROOT: ${FILES_ROOT:-/files}
      COMPANY_NAME: ${COMPANY_NAME:-Company}
      LANGUAGE: ${LANGUAGE:-en}
    volumes:
      - mail_storage:/storage
      - files_storage:/files
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  review-worker:
    build: .
    container_name: mailflow-review-worker
    restart: unless-stopped
    depends_on:
      - redis
    command: ["python", "-m", "app.review.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ROOT: ${STORAGE_ROOT}
      MASTER_KEY: ${MASTER_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      LANGUAGE: ${LANGUAGE:-en}
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"  

  query-worker:
    build: .
    container_name: mailflow-query-worker
    restart: unless-stopped
    depends_on:
      - redis
    command: ["python", "-m", "app.query.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      STORAGE_ROOT: ${STORAGE_ROOT}
      MASTER_KEY: ${MASTER_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      REPORT_RECIPIENT: ${REPORT_RECIPIENT}
      LANGUAGE: ${LANGUAGE:-en}
    volumes:
      - mail_storage:/storage
    networks:
      - mail
      - database
      - ai
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"  

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard  # Lembra-te de criar este ficheiro
    container_name: mailflow-dashboard
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - STORAGE_ROOT=${STORAGE_ROOT}
      - DASHBOARD_USER=${DASHBOARD_USER}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - MASTER_KEY=${MASTER_KEY}
      - LANGUAGE=${LANGUAGE:-en}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Docker SDK — worker control
    networks:
      - mail
      - database
      - proxy
    labels:
      - "traefik.enable=true"
      # Roteamento HTTP (Porta 80) -> Redireciona para HTTPS se tiveres isso no Traefik
      - "traefik.http.routers.mailflow-dash.rule=Host(`ai-mailflow-dashboard.appa8.com`)"
      - "traefik.http.routers.mailflow-dash.entrypoints=websecure"
      - "traefik.http.routers.mailflow-dash.tls=true"
      - "traefik.http.routers.mailflow-dash.tls.certresolver=letsencrypt" # O nome do teu resolver no Traefik
      # Porta interna do Streamlit
      - "traefik.http.services.mailflow-dash.loadbalancer.server.port=8501"
    
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"  


volumes:
  redis_data:
  mail_storage:
  files_storage: